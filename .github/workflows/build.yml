name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build AutoIME.sln -c Release
      # Microsoft IME (日本語) や英語のスペルチェッカーが無い環境では、それらを使うテストは飛ばされる。
      - name: Test
        run: dotnet run --project src/AutoIME.Tests/AutoIME.Tests.csproj -c Release --no-build

  package:
    # タグ (v0.1.0 など) を push したときだけ、テスト版の zip を作ってリリースに添付する。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package
        shell: powershell
        run: .\Build-Package.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoIME-test-*.zip
