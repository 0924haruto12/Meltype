<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Meltype — 雪解けのように、半角/全角の壁を溶かす日本語入力">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset="0.55" stop-color="#cfe4fb"/>
      <stop offset="1" stop-color="#a9cdf4"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4f91"/>
      <stop offset="1" stop-color="#3b82d6"/>
    </linearGradient>
    <linearGradient id="melt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" rx="24" fill="url(#sky)"/>
  <!-- 溶けていく雪の層 -->
  <path d="M24 0 H936 a24 24 0 0 1 24 24 V52 c-40 0 -48 34 -82 34 s-36 -26 -70 -26 s-30 46 -66 46 s-34 -40 -72 -40 s-40 22 -78 22 s-30 -30 -66 -30 s-38 58 -76 58 s-36 -44 -72 -44 s-34 26 -70 26 s-38 -34 -74 -34 s-30 42 -66 42 s-38 -30 -72 -30 s-36 20 -66 20 S30 52 0 52 V24 A24 24 0 0 1 24 0 Z" fill="url(#melt)"/>
  <!-- しずく -->
  <path d="M396 102 c0 0 -9 12 -9 18 a9 9 0 0 0 18 0 c0 -6 -9 -18 -9 -18 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M672 92 c0 0 -7 9 -7 14 a7 7 0 0 0 14 0 c0 -5 -7 -14 -7 -14 Z" fill="#ffffff" opacity="0.75"/>
  <path d="M168 96 c0 0 -6 8 -6 12 a6 6 0 0 0 12 0 c0 -4 -6 -12 -6 -12 Z" fill="#ffffff" opacity="0.7"/>
  <!-- 雪の結晶 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="translate(860 170)">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11" x2="19" y2="-11"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" transform="translate(808 120)">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5"/>
    <line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5"/>
  </g>
  <!-- アイコン -->
  <circle cx="110" cy="158" r="44" fill="#3b82d6"/>
  <text x="110" y="174" text-anchor="middle" font-family="'Yu Gothic UI','Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="46" font-weight="700" fill="#ffffff">あ</text>
  <!-- 名前と説明 -->
  <text x="178" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="700" fill="url(#title)" letter-spacing="1">Meltype</text>
  <text x="182" y="204" font-family="'Yu Gothic UI','Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="22" fill="#1d4f91">雪解けのように、半角/全角の壁を溶かす日本語入力。</text>
</svg>
